[package]
name = "matter-home-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Serveur Matter Home : pilote les appareils Matter over Thread, exécute les automatisations et garde l'historique (sans interface graphique)"
license.workspace = true

[lib]
name = "matter_home_server"
path = "src/lib.rs"

[[bin]]
name = "matter-home-server"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
anyhow = "1"
chrono = "0.4"
directories = "6"
env_logger = "0.11"
hex = "0.4"
if-addrs = "0.13"
log = "0.4"
matc = "0.1.3"
p256 = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
# Réseau : HTTPS + WebSocket (étape 3). TLS en rustls avec ring, sans aws-lc.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Certificat auto-signé du serveur (matc::cert_x509 ne produit que des certificats Matter).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Compte unique : mot de passe haché, comparaisons à temps constant, saisie sans écho.
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
rpassword = "7"
# Caméras RTSP (#4) : `retina` est une bibliothèque cliente RTSP en Rust pur (tokio, sans TLS ni
# FFmpeg), licence MIT ou Apache-2.0, qui décrit les flux (DESCRIBE, authentification Basic et
# Digest, lecture du SPS H.264 et H.265) et relaie les paquets sans décoder. Voir `cameras.rs`.
retina = "=0.4.21"
url = "2"
percent-encoding = "2"
# Course des essais de connexion (FuturesUnordered) ; déjà dans l'arbre via axum.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Vignettes (#12) : décodage par VideoToolbox (caisse partagée avec le client) et encodage JPEG par
# `jpeg-encoder`, en Rust pur, sans dépendance ni code C, licence MIT ou Apache-2.0. Ni FFmpeg ni
# libjpeg : rien à embarquer dans l'application.
matter-home-video = { path = "../video" }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
# Fausse caméra RTSP des tests : en-tête d'authentification Basic.
base64 = "0.22"
# Idem : réponse Digest attendue par la fausse caméra.
md-5 = "0.10"
