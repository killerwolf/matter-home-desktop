[package]
name = "matter-home-server"
version.workspace = true
edition.workspace = true
description = "Serveur Matter Home : pilote les appareils Matter over Thread, exécute les automatisations et garde l'historique (sans interface graphique)"
license.workspace = true

[lib]
name = "matter_home_server"
path = "src/lib.rs"

[[bin]]
name = "matter-home-server"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
anyhow = "1"
chrono = "0.4"
directories = "6"
env_logger = "0.11"
hex = "0.4"
if-addrs = "0.13"
log = "0.4"
matc = "0.1.3"
p256 = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
