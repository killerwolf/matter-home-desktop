[package]
name = "matter-home-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Client de bureau Matter Home (egui) : capteurs, plan de la maison, automatisations"
license.workspace = true

[lib]
name = "matter_home_client"
path = "src/lib.rs"

[[bin]]
name = "matter-home-desktop"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
matter-home-theme = { path = "../theme" }
chrono = "0.4"
directories = "6"
eframe = "0.37"
egui_plot = "0.38"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Réseau, sans tokio : des fils d'exécution et des sockets bloquants, hors du fil de
# l'interface. TLS en rustls avec ring (comme le serveur), sans aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Analyse des réponses HTTP/1.1 (en-têtes). Les requêtes sont écrites à la main.
httparse = "1"
# WebSocket synchrone, par-dessus le flux TLS que nous ouvrons nous-mêmes.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# Autorités racines publiques (Mozilla), pour valider le certificat Let's Encrypt de Tailscale
# derrière `tailscale serve` (adresse `*.ts.net` sur le port 443, voir `net/tls.rs`).
webpki-roots = "1"
# Empreinte SHA-256 du certificat du serveur.
sha2 = "0.10"
# Sélecteur de fichier du système (export, import, CSV), déjà utilisé par la v0.2.1.
rfd = "0.17.2"

# Décodage vidéo des caméras (#5) : VideoToolbox, dans la caisse partagée avec le serveur.
matter-home-video = { path = "../video" }

# Image fixe d'une caméra (#12) : le serveur renvoie du JPEG. Décodeur en Rust pur, déjà dans
# l'arbre des dépendances (via `image`, tiré par eframe) : aucune caisse de plus dans le Cargo.lock.
zune-jpeg = "0.5"
zune-core = "0.5"

[dev-dependencies]
# Fabrique le JPEG d'essai du décodeur (le serveur utilise la même caisse pour ses images).
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
# Certificats de test (autorité, certificat auto-signé) pour les essais d'épinglage et de chaîne
# publique de `net/tls.rs`.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
