[package]
name = "matter-home-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Client de bureau Matter Home (egui) : capteurs, plan de la maison, automatisations"
license.workspace = true

[lib]
name = "matter_home_client"
path = "src/lib.rs"

[[bin]]
name = "matter-home-desktop"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
chrono = "0.4"
directories = "6"
eframe = "0.37"
egui_plot = "0.38"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Réseau, sans tokio : des fils d'exécution et des sockets bloquants, hors du fil de
# l'interface. TLS en rustls avec ring (comme le serveur), sans aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Analyse des réponses HTTP/1.1 (en-têtes). Les requêtes sont écrites à la main.
httparse = "1"
# WebSocket synchrone, par-dessus le flux TLS que nous ouvrons nous-mêmes.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# Empreinte SHA-256 du certificat du serveur.
sha2 = "0.10"
# Sélecteur de fichier du système (export, import, CSV), déjà utilisé par la v0.2.1.
rfd = "0.17.2"

# Décodage vidéo des caméras (#5) : VideoToolbox, le décodeur H.264 matériel de macOS. Rien à
# embarquer dans le DMG ni à installer. Liaisons générées (objc2), mêmes versions que le reste
# de l'arbre ; hors macOS, `video` compile un décodeur qui refuse tout (voir `video/mod.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2", "CFBase", "CFData", "CFDictionary", "CFNumber", "CFString", "CFArray"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMBase", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "bitflags", "CVPixelBufferPool", "CVReturn", "CVPixelFormatDescription"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "objc2", "VTDecompressionSession", "VTErrors", "VTSession", "objc2-core-media", "objc2-core-video", "block2", "bitflags"] }
