[package]
name = "matter-home-desktop"
version = "0.1.0"
edition = "2021"
description = "Contrôleur Matter over Thread de bureau (egui + matc) : capteurs, plan de la maison, automatisations"
license = "MIT"

[[bin]]
name = "matter-home-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
directories = "6"
eframe = "0.37"
egui_plot = "0.38"
env_logger = "0.11"
hex = "0.4"
log = "0.4"
matc = "0.1.3"
p256 = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
strip = true

# Copie locale de matc 0.1.3 avec des délais adaptés aux appareils « sleepy »
# et des certificats valables 20 ans (voir README, section « Option retenue »).
[patch.crates-io]
matc = { path = "vendor/matc" }
